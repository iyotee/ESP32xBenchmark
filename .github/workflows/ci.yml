name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest

  firmware-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [esp32dev, esp32s2, esp32s3, esp32c3, esp32c3_supermini, esp32c6, esp8266]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install platformio
      - run: pio run -d platformio_test -e ${{ matrix.environment }}
